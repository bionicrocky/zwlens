name: CI

# Runs the test suite and an install check on GitHub's hosted runners, on
# Linux, macOS and Windows, for the oldest and newest supported Python.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        # GitHub's newest Ubuntu image has no Python 3.9 build, so the oldest
        # supported Python is tested on Ubuntu 24.04 instead.
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        timeout-minutes: 5
        run: python -m unittest discover -s tests -v
      - name: Install and run the command
        run: |
          python -m pip install .
          zwlens --help

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "seewave"
version = "0.1.0"
description = "Cross-platform Z-Wave traffic analyzer: conversations, troubleshooting, network categorisation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
seewave = "seewave.__main__:main"

[tool.setuptools]
packages = ["seewave", "seewave.parsers"]

[tool.setuptools.package-data]
seewave = ["web/*"]

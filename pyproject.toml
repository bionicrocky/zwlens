[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zwlens"
version = "0.1.0"
description = "Cross-platform Z-Wave traffic analyzer: conversations, troubleshooting, network categorisation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
zwlens = "zwlens.__main__:main"

[tool.setuptools]
packages = ["zwlens", "zwlens.parsers"]

[tool.setuptools.package-data]
zwlens = ["web/*"]
